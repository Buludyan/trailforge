packages:
  - 'apps/*'
  - 'packages/*'

# Moved here from apps/web/pnpm-workspace.yaml, generated by create-next-app:
# a nested workspace root breaks workspace:* links.
allowBuilds:
  # esbuild unpacks its native binary in postinstall — vitest will not start without it
  esbuild: true
  sharp: false
  unrs-resolver: false
